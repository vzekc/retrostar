[defaults]
inventory = ./inventory/hosts.ini
retry_files_enabled = False
result_format = yaml
inject_facts_as_vars = False
interpreter_python = auto_silent
# Roles from other repositories, from requirements.yml, go into galaxy-roles.
roles_path = ./roles:./galaxy-roles

[ssh_connection]
pipelining = True
# An operator role that clones private dotfiles uses the agent here.
ssh_common_args = -o ForwardAgent=yes
