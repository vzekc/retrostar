# travelstar, Hans Hübner's router: a Raspberry Pi 2 on the wire of the
# Classic Computing exhibition's network. It boots the DECserver 200/MC there
# and offers its ports the FotoFix booth's services, which run on fotofix's
# serial agent. It reaches the internet over a USB Ethernet adapter, or over
# an Edimax EW-7811Un when it is on wifi.

router_image: armhf
router_shell: /bin/zsh
router_extra_roles: [operator]
operator_groups: [users, sudo, adm, dialout, netdev]

# The dongle's RTL8188CUS runs under rtl8192cu; the two other drivers that
# claim it are kept off. bring-up loads the driver on the card's first boot.
# The Pi's USB controller must stay on its default dwc_otg driver: under
# dtoverlay=dwc2 in /boot/firmware/config.txt the dongle loses a third of its
# packets at full signal, DHCP renewals fail and NetworkManager drops the
# wifi. rtl8xxxu is no alternative, as the Raspberry Pi kernel's rtl8xxxu
# does not claim the EW-7811Un (7392:7811).
usb_wifi_blacklist: [rtl8xxxu, 8192cu]
usb_wifi_driver: rtl8192cu
# The dongle is out: travelstar reaches the internet over the uplink below.
usb_wifi_watchdog: false

# The exhibition network's wire, on a USB Gigabit adapter (RTL8153).
uplink_mac: 00:e0:4c:68:3a:b9
uplink_address: 10.1.73.2/8
uplink_gateway: 10.0.0.1
uplink_dns: [10.0.0.1]

# The DECserver 200/MC, 08:00:2b:06:9b:9e.
mop_files:
  - file: PR0801ENG.SYS
    names: [08002b069b9e.SYS]

# fotofix's address on the exhibition network: the home network's here, the
# hall's at the show, given there with -e fotofix_address=…
fotofix_address: 192.168.2.208
# The FotoFix services, each carried to fotofix's telnet port for it: the
# photo program, the login and the Kermit server. fotofix records which
# DECserver port each photo file went out of, from FOTOFIX_ORIGIN. A
# DECserver port's terminal goes under terminals, by the DECserver's node
# and port name; a session from a port not named there gets the photo
# program's own question.
fotofix_lat_origin:
  FOTOFIX_ORIGIN: "lat:{node}:{port}"
fotofix_lat_terminals:
  # The GIGI (VK100) on m32's first port.
  M32 PORT_1: vk100
lat_services:
  - name: FOTOFIX
    description: FotoFix - das Foto auf diesem Terminal
    telnet: "{{ fotofix_address }}:23"
    speed: 9600
    terminals: "{{ fotofix_lat_terminals }}"
    environment: "{{ fotofix_lat_origin }}"
  - name: FOTOSHELL
    description: FotoFix login
    telnet: "{{ fotofix_address }}:2323"
    speed: 9600
    terminals: "{{ fotofix_lat_terminals }}"
    environment: "{{ fotofix_lat_origin }}"
  - name: FOTOKERMIT
    description: FotoFix Kermit-Server
    telnet: "{{ fotofix_address }}:2324"
    speed: 9600
    environment: "{{ fotofix_lat_origin }}"

# The Siemens 9772 at the exhibition shows its information pages.
infodisplay_url: https://2026.classic-computing.de
infodisplay_port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG044TU5-if00-port0

# The IBM 3192 on the coax interface, a client of the TN3270 host on the
# hall network.
oec_host: 10.1.97.2:3270
oec_port: /dev/serial/by-id/usb-coax-tcp_Coax_Interface_000000-if00
# The coax interface shows only half the 3192's screen with EAB.
oec_eab: false
