- name: Install what oec needs
  apt:
    name: [git, python3-venv]
    state: present

- name: Check out oec
  git:
    repo: '{{ oec_repo }}'
    dest: '{{ oec_dir }}/src'
    version: '{{ oec_version }}'
  notify: restart oec

- name: Install oec's Python packages
  pip:
    requirements: '{{ oec_dir }}/src/requirements.txt'
    virtualenv: '{{ oec_dir }}/venv'
    virtualenv_command: python3 -m venv
  notify: restart oec

- name: Install the launcher that hides the terminal's features
  copy:
    src: oec-without-eab.py
    dest: '{{ oec_dir }}/oec-without-eab.py'
    mode: '0644'
  notify: restart oec

- name: Install the service
  template:
    src: oec.service.j2
    dest: /etc/systemd/system/oec.service
    mode: '0644'
  notify: restart oec

- name: Ensure oec is running
  systemd_service:
    name: oec
    state: started
    enabled: true
    daemon_reload: true
