# latd on the bridge, so terminal servers on the router's wire and on the
# RetroStar network behind it reach its services alike.
lat_interface: br0
# The services latd offers. A session runs `command` under `user` on a pty;
# latd splits the command at spaces and knows no quoting.
#
#   lat_services:
#     - name: FOTOFIX
#       ident: FotoFix login
#       command: /usr/bin/socat STDIO,raw,echo=0 TCP:192.168.2.208:2300
#       user: nobody
lat_services: []
# Packages the services' commands need.
lat_packages: []
# What latd sends a session before its command starts, written to
# /etc/issue.lat. Empty, it sends nothing, rather than the system's
# /etc/issue.net.
lat_issue: ''
