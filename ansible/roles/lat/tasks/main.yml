- name: Install latd and what its services run
  apt:
    name: "{{ ['latd'] + lat_packages }}"
    state: present

- name: Serve LAT on the bridge
  copy:
    dest: /etc/default/latd
    content: |
      LATD_OPTIONS="-i {{ lat_interface }}"
    mode: '0644'
  notify: restart latd

- name: Set the greeting a session starts with
  # Read afresh for every session.
  copy:
    dest: /etc/issue.lat
    content: '{{ lat_issue }}'
    mode: '0644'

- name: Install the FotoFix connector
  # What a service runs to reach fotofix's serial agent, naming the session's
  # terminal server and port to it.
  copy:
    src: lat-fotofix
    dest: /usr/local/bin/lat-fotofix
    mode: '0755'

- name: Configure the services
  template:
    src: latd.conf.j2
    dest: /etc/latd.conf
    mode: '0644'
  notify: restart latd

- name: Ensure latd is running
  systemd_service:
    name: latd
    state: started
    enabled: true
