- name: Remove latd
  # lattice speaks LAT on the bridge in its place; the two cannot share it.
  apt:
    name: latd
    state: absent
    purge: true

- name: Remove what latd's services ran
  file:
    path: '{{ item }}'
    state: absent
  loop:
    - /usr/local/bin/lat-fotofix
    - /etc/latd.conf
    - /etc/default/latd
    - /etc/issue.lat

- name: Ensure the keyring directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add the lattice repository's signing key
  get_url:
    url: https://code.netzhansa.com/api/packages/hanshuebner/debian/repository.key
    dest: /etc/apt/keyrings/lattice.asc
    mode: '0644'

- name: Add the lattice repository
  apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/lattice.asc]
      https://code.netzhansa.com/api/packages/hanshuebner/debian stable main
    filename: lattice
    state: present

- name: Ensure lattice's configuration directory exists
  file:
    path: /etc/lattice
    state: directory
    mode: '0755'

- name: Configure the services
  # Before the package, whose installation starts latticed: the packaged
  # configuration would take every USB serial adapter as a port, the
  # information display's among them. apt keeps a configuration file that is
  # already there.
  template:
    src: lattice.yml.j2
    dest: /etc/lattice/lattice.yml
    mode: '0644'
  notify: restart latticed

- name: Install lattice
  apt:
    name: lattice
    state: latest
    update_cache: true
  notify: restart latticed

- name: Ensure latticed is running
  systemd_service:
    name: latticed
    state: started
    enabled: true
